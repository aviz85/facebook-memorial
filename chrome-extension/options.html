<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הגדרות תוסף יום הזיכרון</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f7f7f7;
      color: #333;
    }
    
    h1 {
      color: #1e3a8a;
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .option-container {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
    }
    
    input[type="checkbox"] {
      margin-left: 10px;
    }
    
    .description {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }
    
    .save-button {
      background-color: #1e3a8a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      font-size: 16px;
    }
    
    .save-button:hover {
      background-color: #152c69;
    }
    
    .status {
      text-align: center;
      margin-top: 10px;
      height: 20px;
      color: #4caf50;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1f2937;
        color: white;
      }
      
      .option-container {
        background-color: #2d3748;
      }
      
      h1 {
        color: white;
      }
      
      .description {
        color: #cbd5e0;
      }
    }
  </style>
</head>
<body>
  <h1>הגדרות תוסף יום הזיכרון</h1>
  
  <div class="option-container">
    <label>
      <input type="checkbox" id="enable-outside-memorial-day">
      הפעל את התוסף בכל ימות השנה
    </label>
    <div class="description">
      אפשרות זו מאפשרת לראות את תמונות הנופלים במהלך כל השנה, ולא רק ביום הזיכרון.
    </div>
  </div>
  
  <button class="save-button" id="save-button">שמור הגדרות</button>
  <div class="status" id="status"></div>
  
  <script src="options.js"></script>
</body>
</html>
